# /qompassai/bunker/Cargo.toml
# Qompass AI Bunker Cargo Config



[workspace]
resolver = "3"
members = ["bunker", "client", "server", "token", "proxy"]

[workspace.dependencies]

[workspace.metadata]
rustfmt = { edition = "2024" }

[profile.release]
opt-level = 3
debug = 1
lto = true

[profile.dev]
opt-level = 1
debug = 2

[profile.bench]
opt-level = 3
debug = 1

